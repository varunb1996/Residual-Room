[project]
name = "residual-room"
version = "0.1.0"
description = "Grounded content and campaign engine for Residual Room"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/residual_room"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a real Postgres with pgvector (DATABASE_URL)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
