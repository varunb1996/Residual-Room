# Residual Room: source manifest (v1)
# commit_allowed: true only when the license permits redistribution (CC BY, MIT, Apache-2.0, own).
# Everything else is fetched locally by the fetch script and never committed.
# license_verified: checked 2026-10-25 (repo LICENSE files; arXiv license labels; ACL Anthology CC BY 4.0 policy).
# Unverified sources default to commit_allowed: false.
# Rule of thumb: papers published at ACL venues (ACL, EMNLP, NAACL, EACL, TACL) are CC BY 4.0 in the
# ACL Anthology. Prefer the Anthology version over arXiv when one exists.
#
# 2026-10-28 (owner-approved, data only): added path (internal), fetch_url and include (external).
# fetch_url is what `make fetch` downloads; url stays the canonical reference. Every fetch_url was
# checked to resolve with the right title. arXiv HTML is pinned to a version. Repos that moved
# (sentence-transformers, ragas) or whose docs moved (LangChain) were rechecked: same licenses.

internal:
  - {id: int-brand-guide, title: Brand Guide v1, status: current, license: own, commit_allowed: true, path: docs/brand-guide.md}
  - {id: int-content-policy, title: Content Policy v1, status: current, license: own, commit_allowed: true, path: docs/content-policy.md}
  - {id: int-schedule-v0, title: Publishing Schedule v0 (Tuesdays), status: superseded, superseded_on: 2026-11-01, license: own, commit_allowed: true, trap: stale_schedule, path: docs/editorial/schedule-v0.md}
  - {id: int-schedule-v1, title: "Publishing Schedule v1 (Thursdays 9:00 IST, Issue 1 on 2026-11-05)", status: current, license: own, commit_allowed: true, path: docs/editorial/schedule-v1.md}
  - {id: int-series, title: Series definitions, status: current, license: own, commit_allowed: true, path: docs/editorial/series.md}
  - {id: int-subscription, title: Subscription rules, status: current, license: own, commit_allowed: true, path: docs/editorial/subscription.md}
  - {id: int-corrections, title: Corrections policy, status: current, license: own, commit_allowed: true, path: docs/editorial/corrections.md}
  - {id: exp-003-v1, title: "Why retrieval fails (original)", status: superseded, license: own, commit_allowed: true, trap: seeded_correction, note: "written after corpus is built", path: docs/explainers/exp-003-v1.md}
  - {id: exp-003-v2, title: "Why retrieval fails (corrected)", status: current, license: own, commit_allowed: true, path: docs/explainers/exp-003-v2.md}

external:
  # Topic 1: Embeddings and semantic search (First Principles)
  - {id: ext-sbert-paper, topic: 1, kind: paper, title: "Sentence-BERT (Reimers & Gurevych, EMNLP 2019)", url: "https://arxiv.org/abs/1908.10084", license: "CC BY 4.0 (ACL Anthology, EMNLP 2019)", license_verified: true, commit_allowed: true, note: "use Anthology version",
     fetch_url: "https://aclanthology.org/D19-1410.pdf"}
  - {id: ext-sbert-repo, topic: 1, kind: docs, title: "sentence-transformers docs", url: "https://github.com/UKPLab/sentence-transformers", license: "Apache-2.0", license_verified: true, commit_allowed: true,
     fetch_url: "https://github.com/huggingface/sentence-transformers", note: "repo moved to huggingface/; license rechecked 2026-10-28",
     include: [README.md, docs/sentence_transformer/usage/semantic_textual_similarity.rst, examples/sentence_transformer/applications/semantic-search/README.md, examples/sentence_transformer/applications/computing-embeddings/README.rst]}
  - {id: ext-hf-course, topic: 1, kind: tutorial, title: "Hugging Face course", url: "https://github.com/huggingface/course", license: "Apache-2.0", license_verified: true, commit_allowed: true,
     include: [chapters/en/chapter5/6.mdx, chapters/en/chapter1/4.mdx]}

  # Topic 2: RAG end to end (First Principles)
  - {id: ext-rag-paper, topic: 2, kind: paper, title: "Retrieval-Augmented Generation (Lewis et al., NeurIPS 2020)", url: "https://arxiv.org/abs/2005.11401", license: "arXiv perpetual non-exclusive (not redistributable)", license_verified: true, commit_allowed: false, note: "local fetch only unless license page says CC BY",
     fetch_url: "https://arxiv.org/html/2005.11401v4"}
  - {id: ext-dpr-paper, topic: 2, kind: paper, title: "Dense Passage Retrieval (Karpukhin et al., EMNLP 2020)", url: "https://arxiv.org/abs/2004.04906", license: "CC BY 4.0 (ACL Anthology, EMNLP 2020)", license_verified: true, commit_allowed: true, note: "use Anthology version",
     fetch_url: "https://aclanthology.org/2020.emnlp-main.550.pdf"}
  - {id: ext-llamaindex, topic: 2, kind: docs, title: "LlamaIndex docs", url: "https://github.com/run-llama/llama_index", license: "MIT", license_verified: true, commit_allowed: true,
     include: [docs/src/content/docs/framework/understanding/rag/index.mdx, docs/src/content/docs/framework/getting_started/concepts.mdx, docs/src/content/docs/framework/optimizing/production_rag.md, docs/src/content/docs/framework/optimizing/basic_strategies/basic_strategies.md]}
  - {id: ext-openai-cookbook, topic: 2, kind: tutorial, title: "OpenAI Cookbook (RAG and embeddings notebooks)", url: "https://github.com/openai/openai-cookbook", license: "MIT", license_verified: true, commit_allowed: true,
     include: [examples/Question_answering_using_embeddings.ipynb, examples/Semantic_text_search_using_embeddings.ipynb, examples/Search_reranking_with_cross-encoders.ipynb]}
  - {id: ext-anthropic-cookbook, topic: 2, kind: tutorial, title: "Anthropic cookbook (retrieval notebooks)", url: "https://github.com/anthropics/claude-cookbooks", license: "MIT", license_verified: true, commit_allowed: true, note: "old anthropic-cookbook URL also resolves; same MIT license",
     include: [capabilities/retrieval_augmented_generation/guide.ipynb, capabilities/contextual-embeddings/guide.ipynb]}

  # Topic 3: Why retrieval fails (Failure Modes; seeded correction topic)
  - {id: ext-langchain-splitters, topic: 3, kind: docs, title: "LangChain text splitters docs", url: "https://github.com/langchain-ai/langchain", license: "MIT", license_verified: true, commit_allowed: true,
     fetch_url: "https://github.com/langchain-ai/docs", note: "splitter docs moved to langchain-ai/docs (MIT, rechecked 2026-10-28)",
     include: [src/oss/integrations/splitters/index.mdx, src/oss/integrations/splitters/recursive_text_splitter.mdx, src/oss/integrations/splitters/split_by_token.mdx]}
  - {id: ext-rag-survey, topic: 3, kind: paper, title: "RAG for LLMs: A Survey (Gao et al., 2023)", url: "https://arxiv.org/abs/2312.10997", license: "not confirmed; treated as non-redistributable", license_verified: false, commit_allowed: false,
     fetch_url: "https://arxiv.org/html/2312.10997v5"}
  - {id: ext-litm-for-t3, topic: 3, kind: paper, ref: ext-litm-paper, note: "reused for long-context failure section"}

  # Topic 4: LLM-as-judge biases (Failure Modes)
  - {id: ext-fair-evaluators, topic: 4, kind: paper, title: "LLMs are not Fair Evaluators (Wang et al., ACL 2024)", url: "https://arxiv.org/abs/2305.17926", license: "CC BY 4.0 (ACL Anthology, ACL 2024)", license_verified: true, commit_allowed: true,
     fetch_url: "https://aclanthology.org/2024.acl-long.511.pdf"}
  - {id: ext-geval, topic: 4, kind: paper, title: "G-Eval (Liu et al., EMNLP 2023)", url: "https://arxiv.org/abs/2303.16634", license: "CC BY 4.0 (ACL Anthology, EMNLP 2023)", license_verified: true, commit_allowed: true,
     fetch_url: "https://aclanthology.org/2023.emnlp-main.153.pdf"}
  - {id: ext-ragas-paper, topic: 4, kind: paper, title: "RAGAS (Es et al., EACL 2024 demo)", url: "https://arxiv.org/abs/2309.15217", license: "CC BY 4.0 (ACL Anthology, EACL 2024 demos)", license_verified: true, commit_allowed: true,
     fetch_url: "https://aclanthology.org/2024.eacl-demo.16.pdf"}
  - {id: ext-ragas-repo, topic: 4, kind: docs, title: "Ragas docs", url: "https://github.com/explodinggradients/ragas", license: "Apache-2.0", license_verified: true, commit_allowed: true,
     fetch_url: "https://github.com/vibrantlabsai/ragas", note: "repo moved to vibrantlabsai/; license rechecked 2026-10-28",
     include: [docs/concepts/metrics/available_metrics/faithfulness.md, docs/concepts/metrics/available_metrics/context_precision.md, docs/concepts/metrics/available_metrics/context_recall.md, docs/concepts/metrics/overview/index.md]}

  # Topic 5: Lost in the Middle (Paper to Practice)
  - {id: ext-litm-paper, topic: 5, kind: paper, title: "Lost in the Middle (Liu et al., TACL 2024)", url: "https://arxiv.org/abs/2307.03172", license: "CC BY 4.0 (TACL)", license_verified: true, commit_allowed: true, note: "use TACL published version, not arXiv v1/v2",
     fetch_url: "https://aclanthology.org/2024.tacl-1.9.pdf"}
  - {id: ext-litm-code, topic: 5, kind: code, title: "lost-in-the-middle code and data", url: "https://github.com/nelson-liu/lost-in-the-middle", license: "MIT", license_verified: true, commit_allowed: true,
     include: [README.md]}

  # Topic 6: Judging LLM-as-a-Judge (Paper to Practice)
  - {id: ext-mtbench-paper, topic: 6, kind: paper, title: "Judging LLM-as-a-Judge with MT-Bench (Zheng et al., NeurIPS 2023)", url: "https://arxiv.org/abs/2306.05685", license: "arXiv perpetual non-exclusive (not redistributable)", license_verified: true, commit_allowed: false, note: "local fetch only unless license page says CC BY",
     fetch_url: "https://arxiv.org/html/2306.05685v4"}
  - {id: ext-fastchat, topic: 6, kind: code, title: "FastChat (MT-Bench implementation)", url: "https://github.com/lm-sys/FastChat", license: "Apache-2.0", license_verified: true, commit_allowed: true,
     include: [fastchat/llm_judge/README.md, fastchat/llm_judge/data/judge_prompts.jsonl]}

# Verification note: repo licenses cover the repo contents; if docs are pulled from a separate docs site, recheck.
