# Residual Room: source manifest (v1)
# commit_allowed: true only when the license permits redistribution (CC BY, MIT, Apache-2.0, own).
# Everything else is fetched locally by the fetch script and never committed.
# license_verified: checked 2026-10-25 (repo LICENSE files; arXiv license labels; ACL Anthology CC BY 4.0 policy).
# Unverified sources default to commit_allowed: false.
# Rule of thumb: papers published at ACL venues (ACL, EMNLP, NAACL, EACL, TACL) are CC BY 4.0 in the
# ACL Anthology. Prefer the Anthology version over arXiv when one exists.

internal:
  - {id: int-brand-guide, title: Brand Guide v1, status: current, license: own, commit_allowed: true}
  - {id: int-content-policy, title: Content Policy v1, status: current, license: own, commit_allowed: true}
  - {id: int-schedule-v0, title: Publishing Schedule v0 (Tuesdays), status: superseded, superseded_on: 2026-11-01, license: own, commit_allowed: true, trap: stale_schedule}
  - {id: int-schedule-v1, title: Publishing Schedule v1 (Thursdays 9:00 IST, Issue 1 on 2026-11-05), status: current, license: own, commit_allowed: true}
  - {id: int-series, title: Series definitions, status: current, license: own, commit_allowed: true}
  - {id: int-subscription, title: Subscription rules, status: current, license: own, commit_allowed: true}
  - {id: int-corrections, title: Corrections policy, status: current, license: own, commit_allowed: true}
  - {id: exp-003-v1, title: "Why retrieval fails (original)", status: superseded, license: own, commit_allowed: true, trap: seeded_correction, note: "written after corpus is built"}
  - {id: exp-003-v2, title: "Why retrieval fails (corrected)", status: current, license: own, commit_allowed: true}

