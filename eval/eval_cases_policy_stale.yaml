  - id: POL-08
    rule: S1
    segment: transitioning
    text: "Reranking is a game-changer. Honestly, it feels like magic."
    expected: {verdict: warn, rules: [S1]}
  - id: POL-09
    rule: S2
    segment: transitioning
    text: "The model understands your documents and wants to find the best answer for you."
    expected: {verdict: warn, rules: [S2]}
  - id: POL-10
    rule: S3
    segment: practitioner
    text: "Read the full explainer here. And while you're at it, subscribe and reply with your toughest eval question."
    expected: {verdict: warn, rules: [S3]}
  - id: POL-11
    rule: S4
