    note: "boundary: attributed view plus our marked opinion"
  - id: POL-06
    rule: P6
    segment: practitioner
    text: "Word is that one major lab is quietly training a retrieval-native model for release next month."
    expected: {verdict: block, rules: [P6]}
  - id: POL-07
    rule: P6
    segment: practitioner
    text: "LangChain is a bloated mess that only amateurs still use."
    expected: {verdict: block, rules: [P6]}
