  - id: POL-12
    rule: S4
    segment: practitioner
    text: "Add a cross-encoder reranker on top of ColBERT-style late interaction to fix recall."
    expected: {verdict: pass, rules: []}
    note: "boundary: same text as POL-11, practitioner segment, so jargon is allowed"

