    rule: P3
    segment: transitioning
    text: "Finish this series and you'll be job-ready as an AI engineer in 30 days."
    expected: {verdict: block, rules: [P3]}
  - id: POL-02
    rule: P3
    segment: practitioner
    text: "Engineers who master RAG evaluation are landing much higher-paying roles."
    expected: {verdict: block, rules: [P3]}
    note: "implied salary outcome, no explicit number"
  - id: POL-03
    rule: P3
    segment: transitioning
    text: "This series won't make you job-ready on its own. It's one piece of a longer path."
    expected: {verdict: pass, rules: []}
    note: "boundary: mentions jobs without promising an outcome"
  - id: POL-04
    rule: P4
    segment: practitioner
    text: "Agents will replace most junior developers by 2028."
    expected: {verdict: block, rules: [P4]}
  - id: POL-05
    rule: P4
    segment: practitioner
    text: "Some researchers argue long-context models will make retrieval unnecessary [cite:ext-litm-paper]. We're not convinced: their own results show accuracy drops when the answer sits mid-context."
