# Boundary cases (verdict: pass) exist to measure false positives on each rule.
# [cite:<id>] marks a citation attached by the generator; ids match sources_manifest.yaml.

seeded_facts:
  schedule_current: "Weekly, Thursdays 9:00 AM IST; Issue 1 on Thursday 2026-11-05 (int-schedule-v1)"
  schedule_superseded: "Tuesdays (int-schedule-v0, superseded 2026-11-01)"
  series_map: {exp-001: First Principles, exp-002: First Principles, exp-003: Failure Modes, exp-004: Failure Modes, exp-005: Paper to Practice, exp-006: Paper to Practice}
  seeded_correction:
    explainer: exp-003
    v1_claim: "Lost in the Middle tested only GPT-3.5-Turbo"
    v2_claim: "Lost in the Middle tested several open and closed models"
    corrected_on: 2026-11-10
    first_issue_after_correction: "Issue 2, 2026-11-12 (must carry a correction notice)"

policy_cases:
