# Publication config: the structured values the deterministic checks need.
# The prose source of truth stays in docs/brand-guide.md and docs/content-policy.md;
# tests/test_config.py fails if this file drifts from the brand guide.
# Swapping publications (e.g. the football config) means swapping this file.

name: Residual Room
segments: [transitioning, practitioner]
default_segment: practitioner  # for eval cases with no segment (decisions.md, 2026-10-28)

docs:
  brand_guide: docs/brand-guide.md
  content_policy: docs/content-policy.md
  schedule: docs/editorial/schedule-v1.md
  corrections: docs/editorial/corrections.md

# What generation can write about (docs/editorial/series.md; drift-tested).
# source_topics: manifest topic numbers whose sources are always eligible for
# retrieval. subtopics: extra retrieval queries (optional, editable).
explainers:
  exp-001: {topic: Embeddings and semantic search, series: First Principles, source_topics: [1]}
  exp-002: {topic: RAG end to end, series: First Principles, source_topics: [2]}
  exp-003: {topic: "Why retrieval fails (chunking, lost context, near-duplicates)", series: Failure Modes, source_topics: [3]}
  exp-004: {topic: LLM-as-judge biases, series: Failure Modes, source_topics: [4],
            subtopics: [position bias, verbosity bias, self-enhancement bias]}
  exp-005: {topic: Lost in the Middle (Liu et al.), series: Paper to Practice, source_topics: [5]}
  exp-006: {topic: Judging LLM-as-a-Judge (Zheng et al.), series: Paper to Practice, source_topics: [6]}

# Where outbound links point: public pages served by the app itself, under
# PUBLIC_BASE_URL (see api/public.py). Only sent pieces are shown there.
site:
  explainers_path: /explainers
  explainer_path: /explainers/{id}
  subscribe_path: /subscribe

# WhatsApp (mock): outside the 24-hour window only these approved templates may be sent.
whatsapp_templates:
  new_issue: "New from Residual Room: {{1}}. Read it here: {{2}}"

# The publication's operational facts (schedule, series, subscription, corrections).
# Tiny docs, always shown to the judge in full when it checks an uncited sentence:
# similarity search ranks them below long docs on the same topic.
operational_sources: [int-schedule-v0, int-schedule-v1, int-series, int-subscription, int-corrections]

# Newsletter schedule (schedule-v1): weekly, Issue 1 on Thursday 2026-11-05.
schedule:
  issue_1: 2026-11-05
  every_days: 7

# Corrections (corrections.md): the first newsletter issue after each one
# must carry a correction notice. Checked by checker/document.py.
corrections:
  - explainer: exp-003
    corrected_source: exp-003-v2
    superseded_source: exp-003-v1
    corrected_on: 2026-11-10
    notice_pattern: '\bcorrection\b'

# S1: brand guide "Avoid:" list. Matched case-insensitively on word boundaries.
avoid_list: [revolutionary, game-changer, magic, insane, secret, 10x, "AGI is near"]

# S3: the four allowed CTA types (brand guide "Calls to action"). Regexes,
# case-insensitive; every match counts as one CTA, so one sentence can hold several.
ctas:
  read_explainer: ['\bread the (full )?explainer\b']
  subscribe: ['\bsubscribe\b']
  read_source: ['\bread the source\b']
  reply_question: ['\breply with\b']

# Exempt segment types (content policy "Exempt from citation"). Patterns match
# the start of a sentence, case-insensitive. "transition" has no pattern: it
# needs judgment, so only the LLM claim extractor assigns it.
exempt_patterns:
  greeting: ['^(hi|hello|hey)\b', '^welcome\b']
  sign_off: ['^—\s*residual room$']
  read_next: ['^read next\b']
  opinion: ['^we think\b', "^we're not convinced\\b", '^we believe\b', '^in our view\b']
