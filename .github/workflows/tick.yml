# The scheduler for the free Render deploy (Render's free tier has no workers or
# cron jobs). Every 10 minutes: send due campaigns and poll Telegram, via
# POST /api/internal/tick. GitHub may run schedules a few minutes late.
#
# Repo secrets needed: APP_URL (https://<service>.onrender.com) and TICK_TOKEN
# (the same value as TICK_TOKEN on Render).
name: tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # "Run workflow" button for a manual tick

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/internal/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          TICK_TOKEN: ${{ secrets.TICK_TOKEN }}
        run: |
          # --retry covers a cold start while a sleeping free instance wakes up.
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $TICK_TOKEN" "$APP_URL/api/internal/tick"
